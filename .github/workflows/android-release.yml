name: Verify and build Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.*'
      - '.github/workflows/android-release.yml'
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib test integration_test test_driver
      - run: flutter test
      - run: flutter build apk --release
      - name: Upload APK to a draft release for device verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            if [ "$(gh release view v1.0.0 --json isDraft --jq .isDraft)" = "true" ]; then
              gh release upload v1.0.0 build/app/outputs/flutter-apk/app-release.apk --clobber
            fi
          else
            gh release create v1.0.0 build/app/outputs/flutter-apk/app-release.apk --draft --target "$GITHUB_SHA" --title "BookShelf 1.0.0" --notes "BookShelf Android release for PRM393 — QE190017 Nguyễn Công Nhất. Device verification is required before publication."
          fi
